# Chicago OS picom config: smooth (anti-aliased) rounded corners and soft
# shadows. Started at login only when OpenGL is hardware accelerated
# (COMPOSITOR=auto in ~/.config/chicago-os/display.conf), or always with
# COMPOSITOR=1. Needs a GPU: on llvmpipe the glx backend uses more than a
# CPU core idle, and the xrender backend's partial repaints left stale
# regions and blank menus on vmwgfx. corner-radius is larger than the
# theme's 12px pixel-rounded frame corners so it covers their steps.
# Menus and tooltips get no effects.
backend = "glx";
glx-no-stencil = true;
vsync = false;
use-damage = true;
# Never stop compositing for a full-screen window: switching back when a
# menu or popup opens is what made menus come up blank or not at all.
unredir-if-possible = false;
shadow = true;
shadow-radius = 10;
shadow-opacity = 0.18;
shadow-offset-x = -6;
shadow-offset-y = -4;
shadow-exclude = [ "window_type = 'desktop'", "window_type = 'dock'", "window_type = 'menu'", "window_type = 'dropdown_menu'", "window_type = 'popup_menu'", "window_type = 'tooltip'", "_NET_WM_STATE@ *= '_NET_WM_STATE_FULLSCREEN'" ];
corner-radius = 14;
rounded-corners-exclude = [ "window_type = 'desktop'", "window_type = 'dock'", "window_type = 'menu'", "window_type = 'popup_menu'", "window_type = 'dropdown_menu'", "window_type = 'tooltip'", "_NET_WM_STATE@ *= '_NET_WM_STATE_FULLSCREEN'", "_NET_WM_STATE@ *= '_NET_WM_STATE_MAXIMIZED_VERT'" ];
fading = false;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
