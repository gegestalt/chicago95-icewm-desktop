# Chicago OS display settings — read by chicago-display-adapt.
# After editing, run:  chicago-display-adapt --force
# Fixed: Retina full resolution means 2 device pixels per point on the
# MacBook screen and the 4K display alike, whatever the window size.
SCALE=2
TARGET_WIDTH=1440
DESKTOP_ICON=32
CURSOR=24
UI_FONT='Ubuntu Sans'
MONO_FONT='JetBrains Mono'
FOLLOW_HOST=1
# auto = smooth corners + shadows (picom) only with 3D acceleration; 1 = always, 0 = never. Read at login.
COMPOSITOR=auto
# Text size for every app (1 = 96 dpi).
TEXT_SCALE=1.1
