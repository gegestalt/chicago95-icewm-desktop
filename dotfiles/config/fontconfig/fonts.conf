<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Chicago OS fonts: one UI face and one code face everywhere.
     Ubuntu Sans for the interface (crisp hinting at small sizes),
     JetBrains Mono for code. Names that themes and old configs ask for
     but that are not installed (Adwaita Sans, Helvetica, Arial...) are
     mapped here, so they no longer fall back to a random font. -->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
  <alias binding="same"><family>sans-serif</family><prefer><family>Ubuntu Sans</family></prefer></alias>
  <alias binding="same"><family>system-ui</family><prefer><family>Ubuntu Sans</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="same"><family>Adwaita Sans</family><prefer><family>Ubuntu Sans</family></prefer></alias>
  <alias binding="same"><family>Cantarell</family><prefer><family>Ubuntu Sans</family></prefer></alias>
  <alias binding="same"><family>helvetica</family><prefer><family>Ubuntu Sans</family></prefer></alias>
  <alias binding="same"><family>Arial</family><prefer><family>Ubuntu Sans</family></prefer></alias>
  <alias binding="same"><family>Adwaita Mono</family><prefer><family>JetBrains Mono</family></prefer></alias>
</fontconfig>
