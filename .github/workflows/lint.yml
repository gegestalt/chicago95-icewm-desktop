name: Lint

on:
  push:
    branches: [master]
  pull_request:

env:
  SCRIPTS: >-
    install.sh
    uninstall.sh
    optional/migrate-firefox-to-deb.sh
    dotfiles/local/bin/build-app-grid

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n (syntax check)
        run: |
          set -e
          for f in $SCRIPTS; do
            echo "checking $f"
            bash -n "$f"
          done

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck $SCRIPTS
